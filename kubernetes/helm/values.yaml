# Grafana Helm Chart Values
# Author: run-as-daemon.ru

# Grafana configuration
replicas: 2

image:
  repository: grafana/grafana
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: grafana.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.example.com

# Admin credentials
adminUser: admin
adminPassword: changeme

# Persistence
persistence:
  enabled: true
  storageClassName: standard
  size: 10Gi

# Datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Plugins
plugins:
  - grafana-piechart-panel
  - grafana-clock-panel

# Environment variables
env:
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-clock-panel"

# Security context
securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472
